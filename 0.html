<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Завдання 0</title>
</head>
<body>
<script>
  function pow(x, n) {
    let result = 1;

    for (let i = 0; i < n; i++) {
      result *= x;
    }

    return result;
  }

  let x = prompt("x?", "");
  let n = prompt("n?", "");

  if (n < 0) {
    alert('Степінь ' + n + ' не підтримується, введіть ціле значення степеня, більшу за 0');
  } else {
    alert( pow(x, n) );
  }

  location.href = "index.html";
</script>
</body>
</html>
